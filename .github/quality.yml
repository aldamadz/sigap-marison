on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run quality
      - run: npm audit --audit-level=high