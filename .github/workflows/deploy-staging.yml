name: Deploy Staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      migration_versions:
        description: Exact applied migration versions since the live runtime, comma-separated
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sigap-staging-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: bash scripts/quality-live-base.sh staging
      - run: npm run quality:changed
      - run: npm audit --audit-level=high

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, linux, x64, sigap-deploy]
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy staging app only
        env:
          MIGRATION_VERSIONS: ${{ inputs.migration_versions || '' }}
        run: bash scripts/deploy-app.sh staging "$GITHUB_SHA" "$MIGRATION_VERSIONS"
