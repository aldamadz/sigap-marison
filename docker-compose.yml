services:
  agenda-flow:
    build:
      context: .
      dockerfile: dockerfile
    image: agenda-flow:local
    container_name: agenda-flow
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PORT: "80"
      SUPABASE_URL: "${SUPABASE_URL:-https://xuhyodtmgwteyslhrkfx.supabase.co}"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-https://xuhyodtmgwteyslhrkfx.supabase.co}"
      MARISON_EXTERNAL_BASE_URL: "${MARISON_EXTERNAL_BASE_URL:-https://marison-external.digivasi.com/api}"
      MARISON_DEFAULT_ENVIRONMENT: "${MARISON_DEFAULT_ENVIRONMENT:-staging}"
      MARISON_ENV_SWITCH_ADMIN_EMAILS: "${MARISON_ENV_SWITCH_ADMIN_EMAILS:-}"
      MARISON_STAGING_BASE_URL: "${MARISON_STAGING_BASE_URL:-https://marison-external.digivasi.com/api}"
      MARISON_STAGING_CLIENT_ID: "${MARISON_STAGING_CLIENT_ID:-}"
      MARISON_STAGING_CLIENT_SECRET: "${MARISON_STAGING_CLIENT_SECRET:-}"
      MARISON_PRODUCTION_BASE_URL: "${MARISON_PRODUCTION_BASE_URL:-https://external.marisonregency.id/api}"
      MARISON_PRODUCTION_CLIENT_ID: "${MARISON_PRODUCTION_CLIENT_ID:-}"
      MARISON_PRODUCTION_CLIENT_SECRET: "${MARISON_PRODUCTION_CLIENT_SECRET:-}"
    env_file:
      - path: .env.server
        required: false
