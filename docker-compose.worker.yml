name: agenda-flow-production-worker

services:
  agenda-pdf-worker:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_APP_PUBLIC_URL: "https://sigap.marisoncloud.com"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: "${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}"
    image: agenda-flow:production
    container_name: agenda-pdf-worker
    restart: always
    command: ["node", "pdf-worker.mjs"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: production
      SUPABASE_URL: "${SUPABASE_URL:-https://xuhyodtmgwteyslhrkfx.supabase.co}"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-https://xuhyodtmgwteyslhrkfx.supabase.co}"
      PDF_WORKER_CONCURRENCY: "${PDF_WORKER_CONCURRENCY:-3}"
      PDF_WORKER_POLL_INTERVAL_MS: "${PDF_WORKER_POLL_INTERVAL_MS:-2000}"
      PDF_WORKER_MAX_IDLE_POLL_INTERVAL_MS: "${PDF_WORKER_MAX_IDLE_POLL_INTERVAL_MS:-30000}"
      PDF_WORKER_MAX_ATTEMPTS: "${PDF_WORKER_MAX_ATTEMPTS:-3}"
      PDF_WORKER_CONVERT_TIMEOUT_MS: "${PDF_WORKER_CONVERT_TIMEOUT_MS:-120000}"
      STORAGE_MODE: "${STORAGE_MODE:-self_hosted_supabase}"
      STORAGE_SUPABASE_URL: "${STORAGE_SUPABASE_URL:-}"
      STORAGE_PUBLIC_BASE_URL: "${STORAGE_PUBLIC_BASE_URL:-}"
    env_file:
      - path: .env.production
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
