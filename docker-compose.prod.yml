name: agenda-flow-production

services:
  agenda-flow:
    build:
      context: .
      dockerfile: dockerfile
      args:
        GIT_SHA: "${DEPLOY_GIT_SHA:?DEPLOY_GIT_SHA is required}"
        VITE_APP_PUBLIC_URL: "https://sigap.marisoncloud.com"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: "${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}"
    image: agenda-flow:production
    container_name: agenda-flow-prod
    restart: always
    ports:
      - "${APP_PORT:-3010}:80"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_ENV: production
      PORT: "80"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      APP_PUBLIC_URL: "https://sigap.marisoncloud.com"
      VITE_APP_PUBLIC_URL: "https://sigap.marisoncloud.com"
      SUPABASE_URL: "${SUPABASE_URL:?Set SUPABASE_URL in .env.production}"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.production}"
      MARISON_DEPLOYMENT_ENVIRONMENT: "production"
      SUBMISSION_DECISIONS_API_TOKEN: "${SUBMISSION_DECISIONS_API_TOKEN:-}"
      MARISON_STAGING_BASE_URL: "${MARISON_STAGING_BASE_URL:-https://marison-external.digivasi.com/api}"
      MARISON_STAGING_CLIENT_ID: "${MARISON_STAGING_CLIENT_ID:-}"
      MARISON_STAGING_CLIENT_SECRET: "${MARISON_STAGING_CLIENT_SECRET:-}"
      MARISON_PRODUCTION_BASE_URL: "${MARISON_PRODUCTION_BASE_URL:-https://external.marisonregency.id/api}"
      MARISON_PRODUCTION_CLIENT_ID: "${MARISON_PRODUCTION_CLIENT_ID:-}"
      MARISON_PRODUCTION_CLIENT_SECRET: "${MARISON_PRODUCTION_CLIENT_SECRET:-}"
      STORAGE_MODE: "${STORAGE_MODE:-self_hosted_supabase}"
      STORAGE_SUPABASE_URL: "${STORAGE_SUPABASE_URL:-}"
      STORAGE_PUBLIC_BASE_URL: "${STORAGE_PUBLIC_BASE_URL:-}"
      STORAGE_PATH_PREFIX: ""
    env_file:
      - path: .env.production
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agenda-marison-sync:
    image: agenda-flow:production
    container_name: agenda-marison-sync
    restart: always
    command: ["node", "server/marison-sync-worker.mjs"]
    depends_on:
      agenda-flow:
        condition: service_healthy
    environment:
      GIT_SHA: "${DEPLOY_GIT_SHA:?DEPLOY_GIT_SHA is required}"
      MARISON_SYNC_ENABLED: "${MARISON_SYNC_ENABLED:-false}"
      MARISON_SYNC_INTERNAL_URL: "http://agenda-flow/api/internal/marison/directory-sync"
      MARISON_SYNC_CRON_TOKEN: "${MARISON_SYNC_CRON_TOKEN:-}"
    env_file:
      - path: .env.production
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
